name: Candidate ISO build (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate ISO
        run: bash iso/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stage-os-candidate-iso
          path: build-work/*.iso
          if-no-files-found: error
          retention-days: 7
